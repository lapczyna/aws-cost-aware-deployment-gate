# Approximate, unverified. See ../manifest.yaml before relying on any figure.
#
# Instance rates are single-AZ PostgreSQL under a bring-your-own-licence-free engine.
# Multi-AZ is charged at roughly double, which the estimator applies rather than the
# catalog carrying a separate rate for every combination.
version: 1
service: AmazonRDS
region: us-east-1
currency: USD

prices:
  - id: rds-db-t3-micro-postgres
    dimension: InstanceHours
    rate: "0.018"
    unit: Hrs
    attributes: {instanceClass: db.t3.micro, engine: postgres, deploymentOption: Single-AZ}
  - id: rds-db-t3-small-postgres
    dimension: InstanceHours
    rate: "0.036"
    unit: Hrs
    attributes: {instanceClass: db.t3.small, engine: postgres, deploymentOption: Single-AZ}
  - id: rds-db-t3-medium-postgres
    dimension: InstanceHours
    rate: "0.072"
    unit: Hrs
    attributes: {instanceClass: db.t3.medium, engine: postgres, deploymentOption: Single-AZ}
  - id: rds-db-t3-large-postgres
    dimension: InstanceHours
    rate: "0.145"
    unit: Hrs
    attributes: {instanceClass: db.t3.large, engine: postgres, deploymentOption: Single-AZ}
  - id: rds-db-m5-large-postgres
    dimension: InstanceHours
    rate: "0.178"
    unit: Hrs
    attributes: {instanceClass: db.m5.large, engine: postgres, deploymentOption: Single-AZ}
  - id: rds-db-r6g-large-postgres
    dimension: InstanceHours
    rate: "0.226"
    unit: Hrs
    attributes: {instanceClass: db.r6g.large, engine: postgres, deploymentOption: Single-AZ}
  - id: rds-db-r6g-xlarge-postgres
    dimension: InstanceHours
    rate: "0.452"
    unit: Hrs
    attributes: {instanceClass: db.r6g.xlarge, engine: postgres, deploymentOption: Single-AZ}

  - id: rds-storage-gp2
    dimension: Storage-GB-Month
    rate: "0.115"
    unit: GB-Mo
    attributes: {storageType: gp2}
  - id: rds-storage-gp3
    dimension: Storage-GB-Month
    rate: "0.115"
    unit: GB-Mo
    attributes: {storageType: gp3}
  - id: rds-backup-storage
    dimension: BackupStorage-GB-Month
    rate: "0.095"
    unit: GB-Mo
    description: Backup storage beyond the allocation included with the instance
