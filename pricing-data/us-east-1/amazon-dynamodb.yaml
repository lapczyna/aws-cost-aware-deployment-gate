# Approximate, unverified. See ../manifest.yaml before relying on any figure.
version: 1
service: AmazonDynamoDB
region: us-east-1
currency: USD

prices:
  - id: dynamodb-ondemand-write
    dimension: WriteRequestUnits
    rate: "0.00000125"
    unit: WRU
    attributes: {billingMode: PAY_PER_REQUEST}
    description: On-demand write request unit. Commonly quoted as $1.25 per million.
  - id: dynamodb-ondemand-read
    dimension: ReadRequestUnits
    rate: "0.00000025"
    unit: RRU
    attributes: {billingMode: PAY_PER_REQUEST}
    description: On-demand read request unit. Commonly quoted as $0.25 per million.
  - id: dynamodb-provisioned-write
    dimension: WriteCapacityUnit-Hours
    rate: "0.00065"
    unit: WCU-Hr
    attributes: {billingMode: PROVISIONED}
  - id: dynamodb-provisioned-read
    dimension: ReadCapacityUnit-Hours
    rate: "0.00013"
    unit: RCU-Hr
    attributes: {billingMode: PROVISIONED}
  - id: dynamodb-storage
    dimension: Storage-GB-Month
    rate: "0.25"
    unit: GB-Mo
    attributes: {tableClass: STANDARD}
