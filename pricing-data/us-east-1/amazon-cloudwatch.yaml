# Approximate, unverified. See ../manifest.yaml before relying on any figure.
version: 1
service: AmazonCloudWatch
region: us-east-1
currency: USD

prices:
  - id: logs-ingestion
    dimension: Logs-Ingestion-GB
    rate: "0.50"
    unit: GB
    attributes: {logGroupClass: STANDARD}
    description: >-
      Ingestion into a standard log group. This is usually the dominant CloudWatch
      Logs charge and the hardest to predict, since volume varies by orders of
      magnitude between applications.
  - id: logs-ingestion-infrequent
    dimension: Logs-Ingestion-GB
    rate: "0.25"
    unit: GB
    attributes: {logGroupClass: INFREQUENT_ACCESS}
  - id: logs-storage
    dimension: Logs-Storage-GB-Month
    rate: "0.03"
    unit: GB-Mo
    description: Archived log storage, per GB-month of retained data
  - id: alarm-standard
    dimension: Alarm-Month
    rate: "0.10"
    unit: Alarm-Mo
    attributes: {resolution: STANDARD}
    description: >-
      One standard-resolution metric alarm, per month. Flat and knowable from the
      template, unlike almost everything else CloudWatch charges for.
  - id: alarm-high-resolution
    dimension: Alarm-Month
    rate: "0.30"
    unit: Alarm-Mo
    attributes: {resolution: HIGH}
    description: >-
      One high-resolution alarm, per month. Selected by a Period below 60 seconds,
      and three times the standard rate - which is the sort of thing worth surfacing
      at review time rather than discovering on a bill.
