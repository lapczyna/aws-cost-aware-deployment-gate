AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The proposed change: give the private subnet outbound internet access, put the
  application behind a load balancer, and make the database highly available.
  Every one of those is a reasonable engineering decision with a recurring cost
  that nothing in the pull request itself makes visible.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnet
      AllocationId: !GetAtt NatEip.AllocationId
      ConnectivityType: public
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet
        - !Ref PrivateSubnet
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  ApplicationServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      SubnetId: !Ref PrivateSubnet
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  ApplicationVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 50
      VolumeType: gp3
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t3.small
      Engine: postgres
      AllocatedStorage: 100
      StorageType: gp3
      MultiAZ: true
      BackupRetentionPeriod: 7
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: payments
