# Root configuration for the cost-aware deployment gate.
#
# Every referenced path is resolved relative to this file and confined to its
# directory: these paths come from a file a pull request can edit.
version: 1

# Pricing region and currency. The bundled catalog covers us-east-1 only; anything
# else resolves to PriceNotFound and is reported as UNKNOWN rather than approximated.
region: us-east-1
currency: USD

# Hours-per-month convention (AWS uses 365 * 24 / 12 = 730). Printed in every report
# so that no reader has to guess whether 730, 720 or 744 was used.
monthly_hours: 730

# Default attribution for resources that carry no tags of their own. Budgets and
# policy scopes match on these.
environment: development
application: payments
team: payments-platform

usage_profile: usage.yaml
budgets: budgets.yaml
policies: policies.yaml

pricing:
  # `fixtures` is the deterministic offline catalog and the only provider that works
  # without AWS credentials. `chain` must be requested explicitly: an implicit
  # fallback would let a failed lookup quietly become a stale price (ADR 0005).
  provider: fixtures

  # No `catalog` here on purpose. Omitting it means the bundled catalog, which
  # resolves correctly both from a source checkout and from an installed wheel,
  # whereas a relative path only works from one of them.
  ttl_hours: 24
