# What the (fictional) bill said, for the accuracy demonstration.
#
# Illustrative, and labelled non-authoritative everywhere it is reported. The awkward
# cases are here on purpose: a change never deployed, a window that has not settled,
# tags activated after deployment, a service billed that was never predicted. Those are
# what the accuracy arithmetic has to get right, and a happy-path fixture would never
# reach them.
version: 1

observations:
  # A good prediction. NAT Gateway hours were close; data processing was not predicted
  # at all - it was one of the three unknowns - and shows up in the bill.
  - fingerprint: aaaa1111aaaa1111aaaa1111aaaa1111
    observed_at: 2026-03-02T06:00:00Z
    window_start: 2026-02-01
    window_end: 2026-03-01
    observed_monthly_amount: {amount: "71.18", currency: USD}
    services:
      - {service: AmazonVPC, monthly_amount: {amount: "44.10", currency: USD}}
      - {service: AWSELB, monthly_amount: {amount: "17.20", currency: USD}}
      - {service: AmazonRDS, monthly_amount: {amount: "9.88", currency: USD}}

  # Multi-AZ RDS came in under the estimate: the instance was stopped for part of the
  # month, which no template can express.
