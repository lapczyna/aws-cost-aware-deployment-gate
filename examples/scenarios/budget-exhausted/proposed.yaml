AWSTemplateFormatVersion: "2010-09-09"
Description: A sandbox with a large instance in it.

Resources:
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: vpc-0demo00000000000
      CidrBlock: 10.0.1.0/24
      Tags:
        - Key: Environment
          Value: development
        - Key: Application
          Value: payments
  TrainingBox:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: m5.xlarge
      Tags:
        - Key: Environment
          Value: development
        - Key: Application
          Value: payments
