AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  A database whose size is decided by the shared platform stack. The export cannot be
  read from this template, so the instance class is genuinely unknown at review time.

Resources:
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: vpc-0demo00000000000
      CidrBlock: 10.0.1.0/24
      Tags:
        - Key: Environment
          Value: production
        - Key: Application
          Value: payments

  LedgerDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: !ImportValue shared-platform-database-class
      Engine: postgres
      AllocatedStorage: 500
      StorageType: gp3
      MultiAZ: true
      BackupRetentionPeriod: 0
      Tags:
        - Key: Environment
          Value: production
        - Key: Application
          Value: payments
