[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aws-cost-aware-deployment-gate"
version = "0.1.0"
description = "Estimate the monthly AWS cost impact of an infrastructure change and gate deployments on budgets and policy"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Artur Lapczynski" }]
keywords = ["aws", "finops", "cost", "cloudformation", "cdk", "cicd", "policy-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.7,<15.0",
]

[project.optional-dependencies]
# Optional AWS Price List provider. Never required for the default offline path.
aws = ["boto3>=1.34,<2.0"]

# Only needed to *synthesise* the example CDK app. The tool itself never imports CDK:
# it consumes synthesised CloudFormation, and the templates are committed under
# examples/cdk/synthesized/ so the default test suite needs neither this nor Node.
cdk = ["aws-cdk-lib>=2.150,<3.0", "constructs>=10.3,<11.0"]
dev = [
    # The Price List adapter's Stubber tests run in the default suite, so the library
    # they stub has to be a development dependency rather than only an optional extra.
    # CI found this: it installs `.[dev]` into a clean environment, which had drifted
    # from a local one where boto3 was installed by hand.
    "boto3>=1.34,<2.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "hypothesis>=6.100,<7.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.6,<0.15",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "import-linter>=2.0,<3.0",
    "types-PyYAML>=6.0,<7.0",
    "boto3-stubs[pricing,ce]>=1.34,<2.0",
]

[project.urls]
Homepage = "https://github.com/lapczyna/aws-cost-aware-deployment-gate"
Documentation = "https://github.com/lapczyna/aws-cost-aware-deployment-gate/tree/main/docs"
Issues = "https://github.com/lapczyna/aws-cost-aware-deployment-gate/issues"

[project.scripts]
cost-gate = "cost_gate.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_gate"]

# The pricing catalog is authored at the repository root so it is reviewable in
# diffs, and force-included into the wheel so an installed package still works.
[tool.hatch.build.targets.wheel.force-include]
"pricing-data" = "cost_gate/_data/pricing"
# Scenarios ship too, so `cost-gate demo` works from an installed package and
# not only from a checkout.
"examples/scenarios" = "cost_gate/_data/scenarios"
"examples/config" = "cost_gate/_data/config"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "pricing-data/",
    "examples/",
    "schemas/",
    "docs/",
    "scripts/",
    "README.md",
    "LICENSE",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime usage
    "T20",       # no print() outside the reporting layer
    "PT",        # pytest style
    "RET",       # return simplification
    "SIM",       # simplify
    "PTH",       # use pathlib
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "TRY",       # exception antipatterns
    "RUF",       # ruff-specific
    "S",         # bandit rules
    "ANN",       # missing annotations
    "D",         # docstrings
]
ignore = [
    "D203",      # conflicts with D211
    "D213",      # conflicts with D212
    "ANN401",    # allow Any where a template value genuinely is arbitrary
    "TRY003",    # long messages in raise are wanted: they surface in reports
    "PLR0913",   # estimators legitimately take several collaborators
    "TRY004",    # validators must raise ValueError: pydantic converts ValueError and
                 # AssertionError into a ValidationError but lets TypeError escape,
                 # bypassing the structured config error reporting.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # asserts are the point
    "D",        # docstrings
    "ANN",      # annotations
    "PLR2004",  # magic numbers
    "S603",     # subprocess: test fixtures build their own git repositories
    "S607",     # partial executable paths: `git` from PATH is what a developer has
]
# CDK code should read like the ecosystem it is demonstrating. Idiomatic CDK Python
# does not annotate **kwargs or document __init__, and making these unidiomatic to
# satisfy a linter would teach the wrong thing.
"examples/cdk/**" = ["D107", "ANN003", "ANN401"]
"infrastructure/**" = ["D107", "ANN003", "ANN401"]
"scripts/**" = ["T20", "D"]                     # the dev runner prints by design
"src/cost_gate/reporting/**" = ["T20"]          # the reporting layer prints by design

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    # `cdk` tests shell out to a real synth: they need Node, the CDK CLI and the [cdk]
    # extra, and they take minutes rather than milliseconds. Opt in with `-m cdk`.
    # Excluded here rather than only in scripts/dev.py so that a bare `pytest` behaves
    # the same way - a default suite that needs a Node toolchain to test a Python
    # library is a default suite people will stop running.
    "-m", "not cdk",
]
markers = [
    "unit: fast, isolated domain tests",
    "property: Hypothesis property-based tests",
    "contract: provider conformance tests (no network)",
    "integration: multi-component wiring tests",
    "e2e: end-to-end CLI tests using checked-in fixtures",
    "cdk: opt-in tests that shell out to a real `cdk synth` (requires Node)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/cost_gate"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist", "examples", "infrastructure"]

# B404 fires on `import subprocess` itself, which is not a finding: it says nothing
# about how the module is used. The two places that use it - adapters/git.py and
# adapters/cdk.py - are reviewed individually and carry their own justification at the
# call site, where B603 still applies. Skipping the import-level check keeps those
# call-site annotations meaningful instead of drowning them in noise.
skips = ["B404"]

# ---------------------------------------------------------------------------
# import-linter: mechanically enforce the ports-and-adapters rule (ADR 0001)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "cost_gate"
# Required because the forbidden list names third-party packages (boto3, typer).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent of infrastructure and delivery"
type = "forbidden"
source_modules = [
    "cost_gate.domain",
    "cost_gate.diff",
    "cost_gate.estimators",
    "cost_gate.policies",
    "cost_gate.budgets",
    "cost_gate.recommendations",
]
forbidden_modules = ["cost_gate.adapters", "cost_gate.cli", "boto3", "typer"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "cost_gate.cli",
    "cost_gate.reporting",
    "cost_gate.policies | cost_gate.budgets | cost_gate.recommendations",
    "cost_gate.estimators",
    "cost_gate.pricing | cost_gate.diff | cost_gate.parsers",
    "cost_gate.config",
    "cost_gate.domain",
]
exhaustive = false
